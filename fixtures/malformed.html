  *some* tree; the adapter MUST handle whatever tree results without
  throwing and MUST degrade capabilities instead of guessing.
-->
</head>

    <div class="action-item" id="workbench.view.explorer"><a class="action-label" aria-label="Explorer">Duplicate id</a></div>
  <!-- unclosed activitybar, unclosed anchors, no sidebar, no editor part -->
  <div class="part statusbar">
stray text node without container
</div>
